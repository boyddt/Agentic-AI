# Connection settings for inbox_sort.py
#
# Copy this file somewhere OUTSIDE the repository, fill it in, then point the
# script at it:
#
#     export INBOX_SORT_CONFIG=~/.config/inbox_sort/connection.txt
#
# The parser reads a LABEL on one line and its value on the next, which is the
# format local mail bridges typically export. Do not commit a filled-in copy.

HOSTNAME
127.0.0.1
PORT
1143
USERNAME
you@example.com
PASSWORD
your-bridge-generated-password
SECURITY
STARTTLS
